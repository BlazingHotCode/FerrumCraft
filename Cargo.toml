[package]
# FerrumCraft is a small Rust/wgpu voxel game prototype.
name = "ferrumcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
# Plain-old-data derives for safely uploading typed vertex/uniform data to wgpu.
bytemuck = { version = "1", features = ["derive"] }
# Small math library used for camera and projection matrices.
glam = "0.29"
# JSON deserialization for game data files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Window and event-loop integration.
winit = "0.30"
# Cross-platform GPU abstraction used by the renderer.
wgpu = "24"
# Blocks on async GPU setup during application startup.
pollster = "0.4"
# Structured logging facade.
log = "0.4"


