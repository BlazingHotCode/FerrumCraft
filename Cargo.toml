[package]
# FerrumCraft is a small Rust/wgpu voxel game prototype.
name = "ferrumcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
# Window and event-loop integration.
winit = "0.30"
# Cross-platform GPU abstraction used by the renderer.
wgpu = "24"
# Blocks on async GPU setup during application startup.
pollster = "0.4"
